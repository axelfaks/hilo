# Render lo lee solo cuando conectás el repo: crea el servicio y la base.
services:
  - type: web
    name: hilo
    runtime: docker
    plan: free
    healthCheckPath: /api/auth/estado
    envVars:
      - key: HILO_SEMBRAR
        value: "1"
      - key: HILO_SECRETO
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false          # la pegás vos en el panel, no viaja en el repo
      - key: DATABASE_URL
        fromDatabase:
          name: hilo-db
          property: connectionString

databases:
  - name: hilo-db
    plan: free
